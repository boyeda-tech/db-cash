<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DB Cash — L'Atelier Privé</title>
  <link rel="apple-touch-icon" href="db-cash-icon.png">
  <link rel="icon" type="image/png" href="db-cash-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:#B4963C; --gold-d:#9A7E2E; --gold-l:#D4B460;
      --bg:#F7F4EF; --bg2:#FFFFFF; --bg3:#EDE8DF;
      --txt:#1A1805; --txt2:#5A5540; --txt3:#9A9580;
      --border:rgba(140,110,40,.18); --border-s:rgba(140,110,40,.30);
      --red:#B71C1C; --green:#2E7D32; --blue:#1565C0;
      --shadow:0 2px 12px rgba(0,0,0,.07);
      --serif:'Cormorant Garamond',Georgia,serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--txt);font-family:var(--serif);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}

    .view{display:none;flex-direction:column;flex:1;min-height:0}
    .view.active{display:flex}

    /* HEADER */
    .hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:var(--shadow)}
    .hdr-title{font-size:22px;font-weight:300;letter-spacing:.08em;flex:1}
    .hdr-title span{color:var(--gold);font-weight:600}
    .hdr-sub{font-size:11px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}
    .btn-back{background:none;border:1px solid var(--border-s);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--txt2);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .btn-back:active{background:var(--bg3)}

    /* TABLES */
    .tables-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;flex:1;align-content:start}
    .table-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:var(--shadow);transition:transform .12s}
    .table-card:active{transform:scale(.97)}
    .table-card.occupied{border-color:var(--gold);background:#FFF9EE}
    .table-card.occupied .t-num{color:var(--gold)}
    .t-num{font-size:30px;font-weight:300;color:var(--txt3)}
    .t-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)}
    .t-ttc{font-size:14px;color:var(--gold);font-style:italic;font-weight:600}
    .t-cov{font-size:10px;color:var(--txt3)}

    .emporter-btn{margin:0 16px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow)}
    .emporter-btn:active{background:var(--bg3)}
    .emp-title{font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
    .emp-sub{font-size:12px;color:var(--txt3);font-style:italic;margin-top:3px}

    .bottom-bar{display:flex;gap:8px;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
    .btn-bar{flex:1;background:none;border:1px solid var(--border-s);border-radius:8px;padding:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);cursor:pointer;font-family:var(--serif)}
    .btn-bar:active{background:var(--bg3)}
    .btn-bar.gold{background:var(--gold);border-color:var(--gold);color:#fff}
    .btn-bar.gold:active{background:var(--gold-d)}

    /* ORDER */
    .covers-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
    .covers-label{font-size:12px;color:var(--txt2)}
    .covers-ctrl{display:flex;align-items:center;gap:8px}
    .cov-btn{width:28px;height:28px;border:1px solid var(--border-s);border-radius:6px;background:var(--bg);color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .cov-val{font-size:16px;min-width:24px;text-align:center;font-weight:600}
    .type-badge{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--border-s);color:var(--txt3)}
    .type-badge.emp{border-color:var(--blue);color:var(--blue)}

    .items-list{flex:1;overflow-y:auto;background:var(--bg)}
    .order-item{display:flex;align-items:flex-start;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--bg2);margin-bottom:1px}
    .oi-main{flex:1;min-width:0}
    .oi-name{font-size:15px}
    .oi-meta{font-size:11px;color:var(--txt3);font-style:italic;margin-top:2px;white-space:pre-wrap}
    .oi-tva{display:inline-block;font-size:9px;color:var(--txt3);border:1px solid var(--border-s);border-radius:10px;padding:1px 6px;margin-top:3px}
    .oi-qty{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:2px}
    .oi-qbtn{width:26px;height:26px;border:1px solid var(--border-s);border-radius:5px;background:var(--bg);color:var(--txt);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .oi-qval{font-size:14px;min-width:20px;text-align:center;font-weight:600}
    .oi-price{font-size:15px;color:var(--gold);min-width:65px;text-align:right;flex-shrink:0;font-weight:600}
    .oi-del{background:none;border:none;color:var(--txt3);font-size:20px;cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1}
    .order-empty{padding:40px;text-align:center;color:var(--txt3);font-style:italic;font-size:15px}

    .order-footer{background:var(--bg2);border-top:1px solid var(--border);padding:12px 16px;flex-shrink:0;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
    .tot-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
    .tot-lbl{font-size:12px;color:var(--txt3)}
    .tot-val{font-size:13px;color:var(--txt2)}
    .tot-ttc{font-size:21px;color:var(--gold);font-weight:600}
    .btn-encaisser{width:100%;margin-top:10px;background:var(--gold);border:none;color:#fff;padding:14px;border-radius:10px;font-size:16px;font-family:var(--serif);letter-spacing:.05em;cursor:pointer}
    .btn-encaisser:active{background:var(--gold-d)}
    .btn-encaisser:disabled{opacity:.35;cursor:default}

    /* ADD SHEET — MENU PICKER */
    .add-sheet{position:fixed;inset:0;background:rgba(30,25,10,.4);z-index:100;display:flex;flex-direction:column;justify-content:flex-end}
    .sheet-inner{background:var(--bg2);border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
    .sheet-hdr{display:flex;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
    .sheet-title{flex:1;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
    .sheet-close{background:none;border:none;font-size:24px;color:var(--txt3);cursor:pointer;line-height:1}
    .sheet-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
    .sheet-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);cursor:pointer;font-family:var(--serif)}
    .sheet-tab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--bg2)}
    .sheet-body{flex:1;overflow-y:auto}

    /* Menu card dans sheet */
    .menu-card{margin:12px;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:16px}
    .menu-card-name{font-size:17px;color:var(--gold);letter-spacing:.06em;margin-bottom:2px}
    .menu-card-price{font-size:13px;color:var(--txt2);font-style:italic;margin-bottom:10px}

    /* Section dans menu card */
    .sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
    .sec-name{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)}
    .sec-badge{font-size:9px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-s)}
    .sec-badge.opt{color:var(--blue);border-color:var(--blue)}
    .sec-badge.sup{color:var(--gold);border-color:var(--gold)}

    /* Choix radio */
    .choice-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
    .choice-row:last-child{border-bottom:none}
    .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-s);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
    .radio.on{border-color:var(--gold);background:var(--gold)}
    .radio.on::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
    .radio.skip{border-color:var(--txt3)}
    .radio.skip::after{content:'—';font-size:10px;color:var(--txt3);line-height:1}
    .choice-name{flex:1;font-size:14px}
    .choice-desc{font-size:11px;color:var(--txt3);font-style:italic}
    .choice-sup{font-size:12px;color:var(--gold);font-style:italic;flex-shrink:0}

    /* Option oui/non */
    .opt-row{display:flex;gap:8px;margin:6px 0}
    .opt-btn{flex:1;background:var(--bg2);border:1.5px solid var(--border-s);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-size:13px;color:var(--txt2);font-family:var(--serif)}
    .opt-btn.on-oui{border-color:var(--gold);background:#FFF9EE;color:var(--gold);font-weight:600}
    .opt-btn.on-non{border-color:var(--txt3);background:var(--bg3);color:var(--txt3)}

    .menu-add-btn{width:100%;margin-top:12px;background:var(--gold);border:none;color:#fff;padding:12px;border-radius:8px;font-size:15px;font-family:var(--serif);cursor:pointer;letter-spacing:.05em}
    .menu-add-btn:disabled{opacity:.35;cursor:default}
    .menu-add-btn:active{background:var(--gold-d)}

    /* Items liste simple */
    .add-item{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
    .add-item:active{background:var(--bg3)}
    .ai-name{flex:1;font-size:15px}
    .ai-meta{font-size:11px;color:var(--txt3);font-style:italic;margin-top:1px}
    .ai-price{font-size:15px;color:var(--gold);font-weight:600;flex-shrink:0}
    .ai-tva{font-size:9px;color:var(--txt3);flex-shrink:0}

    /* Article libre */
    .libre-form{padding:16px;display:flex;flex-direction:column;gap:10px}
    .libre-row{display:grid;grid-template-columns:1fr auto auto;gap:8px}
    .a-inp{background:var(--bg);border:1px solid var(--border-s);border-radius:6px;padding:9px 11px;font-size:14px;color:var(--txt);font-family:var(--serif)}
    .a-inp:focus{outline:none;border-color:var(--gold)}
    .a-sel{background:var(--bg);border:1px solid var(--border-s);border-radius:6px;padding:9px 6px;font-size:13px;color:var(--txt2);cursor:pointer;font-family:var(--serif)}
    .a-sel:focus{outline:none;border-color:var(--gold)}
    .btn-libre{background:var(--gold);border:none;color:#fff;border-radius:6px;padding:9px 18px;font-size:14px;cursor:pointer;font-family:var(--serif)}

    /* PAIEMENT */
    .pay-body{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
    .pay-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
    .pay-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px}
    .pay-item-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--txt2)}
    .pay-total-row{display:flex;justify-content:space-between;font-size:19px;color:var(--gold);font-weight:600;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .tva-line{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:3px}
    .pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .pay-meth{background:var(--bg2);border:2px solid var(--border);border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
    .pay-meth.on{border-color:var(--gold);background:#FFF9EE}
    .pay-meth-icon{font-size:24px;margin-bottom:4px}
    .pay-meth-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
    .pay-esp{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
    .pay-esp-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px}
    .pay-esp-inp{width:100%;font-size:24px;background:transparent;border:none;border-bottom:1.5px solid var(--border-s);color:var(--gold);padding:6px 0;font-family:var(--serif);text-align:right}
    .pay-esp-inp:focus{outline:none;border-bottom-color:var(--gold)}
    .pay-rendu{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
    .rendu-lbl{font-size:12px;color:var(--txt3)}
    .rendu-val{font-size:22px;font-weight:600}
    .btn-valider{width:100%;background:var(--gold);border:none;color:#fff;padding:16px;border-radius:10px;font-size:17px;font-family:var(--serif);letter-spacing:.05em;cursor:pointer;margin-top:8px}
    .btn-valider:active{background:var(--gold-d)}
    .btn-valider:disabled{opacity:.35;cursor:default}

    /* TICKET */
    .ticket-view{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;overflow-y:auto;background:var(--bg)}
    .ticket-paper{background:#fff;color:#1a1a1a;width:100%;max-width:360px;padding:20px;border-radius:8px;font-family:Georgia,serif;box-shadow:0 2px 16px rgba(0,0,0,.12)}
    .tk-logo{text-align:center;margin-bottom:12px;border-bottom:1px solid #ddd;padding-bottom:12px}
    .tk-name{font-size:22px;font-weight:300;letter-spacing:.1em}
    .tk-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#888;margin-top:2px}
    .tk-info{font-size:10px;color:#666;margin-bottom:10px;text-align:center;line-height:1.6}
    .tk-items{border-top:1px dashed #ccc;border-bottom:1px dashed #ccc;padding:8px 0;margin-bottom:8px}
    .tk-item{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
    .tk-item-name{flex:1;padding-right:8px}
    .tk-item-qty{min-width:24px;text-align:center;color:#888}
    .tk-item-price{min-width:55px;text-align:right}
    .tk-item-meta{font-size:9px;color:#999;padding-left:8px;font-style:italic;margin-bottom:3px}
    .tk-totals{font-size:11px;margin-bottom:8px}
    .tk-tot-row{display:flex;justify-content:space-between;margin-bottom:2px}
    .tk-tot-row.big{font-size:15px;font-weight:bold;border-top:1px solid #ccc;padding-top:5px;margin-top:5px}
    .tk-tva{font-size:9px;color:#888;margin-bottom:8px}
    .tk-tva-row{display:flex;justify-content:space-between;margin-bottom:1px}
    .tk-pay{font-size:11px;margin-bottom:8px;border-top:1px dashed #ccc;padding-top:8px}
    .tk-footer{font-size:9px;color:#999;text-align:center;border-top:1px solid #ddd;padding-top:8px;line-height:1.6}
    .tk-hash{font-size:7px;color:#ccc;text-align:center;margin-top:6px;word-break:break-all}
    .ticket-btns{display:flex;gap:10px;margin-top:16px;width:100%;max-width:360px}
    .btn-print{flex:1;background:var(--gold);border:none;color:#fff;padding:13px;border-radius:8px;font-size:14px;font-family:var(--serif);cursor:pointer}
    .btn-new{flex:1;background:none;border:1.5px solid var(--border-s);color:var(--txt2);padding:13px;border-radius:8px;font-size:14px;font-family:var(--serif);cursor:pointer}

    /* EMPORTER */
    .emp-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
    .emp-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:12px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);cursor:pointer;font-family:var(--serif)}
    .emp-tab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--bg2)}
    .emp-body{flex:1;overflow-y:auto;background:var(--bg)}
    .emp-cart-strip{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:13px;color:var(--txt2);flex-shrink:0;display:none}
    .emp-cart-strip.show{display:block}

    /* Z */
    .z-body{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
    .z-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
    .z-card-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
    .z-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
    .z-lbl{color:var(--txt2)}
    .z-val{color:var(--txt);font-weight:600}
    .z-total{display:flex;justify-content:space-between;font-size:19px;color:var(--gold);font-weight:600;padding-top:10px;border-top:1px solid var(--border);margin-top:6px}
    .z-empty{text-align:center;padding:60px;color:var(--txt3);font-style:italic}

    /* ADMIN */
    .login-box{max-width:320px;margin:3rem auto;padding:2rem;background:var(--bg2);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
    .login-title{font-size:18px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem}
    .login-inp{width:100%;background:var(--bg);border:1px solid var(--border-s);border-radius:6px;padding:10px;font-size:16px;color:var(--txt);font-family:var(--serif);margin-bottom:.6rem}
    .login-inp:focus{outline:none;border-color:var(--gold)}
    .login-btn{width:100%;background:var(--gold);border:none;color:#fff;padding:12px;border-radius:8px;font-size:15px;font-family:var(--serif);cursor:pointer}
    .login-err{font-size:12px;color:var(--red);margin-top:.4rem;text-align:center}
    .adm-body{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
    .adm-sec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
    .adm-sec-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
    .adm-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    .adm-inp{flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border-s);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--txt);font-family:var(--serif)}
    .adm-inp:focus{outline:none;border-color:var(--gold)}
    .adm-sel{background:var(--bg);border:1px solid var(--border-s);border-radius:6px;padding:8px 6px;font-size:12px;color:var(--txt2);cursor:pointer;font-family:var(--serif)}
    .adm-btn{background:none;border:1px solid var(--border-s);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--txt2);cursor:pointer;white-space:nowrap;font-family:var(--serif)}
    .adm-btn:active{background:var(--bg3)}
    .adm-btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
    .adm-btn.danger{color:var(--red);border-color:rgba(183,28,28,.3)}
    .adm-item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border)}
    .adm-item-name{flex:1;font-size:13px}
    .adm-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
    .adm-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);cursor:pointer;font-family:var(--serif)}
    .adm-tab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--bg2)}

    /* Section admin */
    .sec-adm-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
    .sec-adm-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .sec-adm-name{flex:1;font-size:14px;font-weight:600;color:var(--txt)}
    .sec-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .sec-type-dot.choice{background:var(--gold)}
    .sec-type-dot.option{background:var(--blue)}
    .sec-type-dot.fixed{background:var(--green)}

    /* TOAST */
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* PRINT */
    @media print{body>*{display:none!important}#print-ticket{display:block!important;padding:0;margin:0}#print-ticket *{color:#000!important;background:#fff!important}}
    #print-ticket{display:none}

    /* SPINNER */
    .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* tag section badge dans order-item */
    .sec-tag{font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
  </style>
</head>

<script>
// ═══════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════
const SB='https://wtjjmwokiehfyakwbqtn.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0amptd29raWVoZnlha3dicXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDc2MTIsImV4cCI6MjA5NTI4MzYxMn0.GHZI71WvEsUWtv6IVVLAsNW_NHeAHKNr0I1cHnrAtDI';
const SH={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'};
async function sbSave(id,data){try{await fetch(SB+'/rest/v1/app_data',{method:'POST',headers:{...SH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({app_id:id,data,updated_at:new Date().toISOString()})});}catch(_){}}
async function sbLoad(id){try{const r=await fetch(SB+'/rest/v1/app_data?app_id=eq.'+id+'&select=data',{headers:SH});if(!r.ok)return null;const j=await r.json();return j[0]?.data||null;}catch(_){return null;}}
async function sbSaveSetting(k,v){try{await fetch(SB+'/rest/v1/app_settings',{method:'POST',headers:{...SH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({app_id:'db-suite',key:k,value:v})});}catch(_){}}
async function sbLoadSetting(k){try{const r=await fetch(SB+'/rest/v1/app_settings?app_id=eq.db-suite&key=eq.'+k+'&select=value',{headers:SH});if(!r.ok)return null;const j=await r.json();return j[0]?.value||null;}catch(_){return null;}}

// ═══════════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════════
// Menu section types :
//   'choice'  → choisir un plat parmi une liste (DB-Carte ou manuel)
//   'option'  → oui/non avec supPrice éventuel (ex: fromage +8€)
//   'fixed'   → inclus automatiquement, pas de choix (ex: café & mignardises)
//
// Section structure :
//   { id, name, type, required, supPrice, source:'carte'|'manual', manualChoices:[{id,name}] }

let PASS = localStorage.getItem('db_cash_pass')||'atelier';
let TICKET_SEQ = parseInt(localStorage.getItem('db_cash_seq')||'0');
let LAST_HASH = localStorage.getItem('db_cash_last_hash')||'0'.repeat(64);
let SESSION_TICKETS = [];
let OPEN_TABLES = {};
let CURRENT_ORDER = null;
let EMP_CART = [];
let EMP_TAB = 0;
let ADM_TAB = 0;
let SHEET_MODE = 'menus';
let CARTE_CACHE = null;
let WINE_CACHE = null;

// Sélections menus en cours de construction
// MENU_SEL[menuId][sectionId] = null | 'skip' | dishName | 'oui'
let MENU_SEL = {};

let CASH_DATA = {
  menuSource: 'carte',  // 'carte' = depuis DB-Carte (auto) | 'manual' = menus de secours admin
  menus: [],            // menus de secours — utilisés seulement si menuSource==='manual'
  carte: []
};

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function fmt(n){return(Math.round(n*100)/100).toFixed(2).replace('.',',')+' €'}
function uid(){return 'i'+Date.now()+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur)}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}

// ═══════════════════════════════════════════════════
// ISCA
// ═══════════════════════════════════════════════════
async function sha256(msg){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function chainedHash(data){const h=await sha256(JSON.stringify(data)+LAST_HASH);LAST_HASH=h;localStorage.setItem('db_cash_last_hash',h);return h;}

// ═══════════════════════════════════════════════════
// DATE
// ═══════════════════════════════════════════════════
function updateDate(){const d=new Date();document.getElementById('hdr-date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

// ═══════════════════════════════════════════════════
// TABLES
// ═══════════════════════════════════════════════════
function renderTables(){
  const g=document.getElementById('tables-grid');
  let h='';
  for(let i=1;i<=8;i++){
    const t=OPEN_TABLES[i],occ=!!t;
    h+=`<div class="table-card${occ?' occupied':''}" onclick="openTable(${i})">
      <div class="t-num">${i}</div><div class="t-lbl">${occ?'En service':'Libre'}</div>
      ${occ?`<div class="t-ttc">${fmt(calcTotal(t.items).ttc)}</div><div class="t-cov">${t.covers} couvert${t.covers>1?'s':''}</div>`:''}
    </div>`;
  }
  g.innerHTML=h;
}
function openTable(n){
  if(!OPEN_TABLES[n])OPEN_TABLES[n]={items:[],covers:2,openedAt:Date.now()};
  CURRENT_ORDER={tableNum:n,isEmporter:false};
  document.getElementById('order-title').innerHTML=`Table <span>${n}</span>`;
  document.getElementById('type-badge').textContent='Sur place';
  document.getElementById('type-badge').classList.remove('emp');
  renderOrder();showView('v-order');
}
function backToAccueil(){saveOpenTables();showView('v-accueil');renderTables();}
function annulerTable(){
  if(!CURRENT_ORDER)return;
  const n=CURRENT_ORDER.tableNum;
  const t=OPEN_TABLES[n];
  const msg=t&&t.items.length
    ?`Annuler la table ${n} et supprimer les ${t.items.length} article${t.items.length>1?'s':''}  ?`
    :`Libérer la table ${n} ?`;
  if(!confirm(msg))return;
  delete OPEN_TABLES[n];
  saveOpenTables();
  showView('v-accueil');
  renderTables();
  toast(`Table ${n} libérée`);
}
function saveOpenTables(){localStorage.setItem('db_cash_tables',JSON.stringify(OPEN_TABLES));}
function loadOpenTables(){const r=localStorage.getItem('db_cash_tables');if(r)try{OPEN_TABLES=JSON.parse(r);}catch(_){}}
function changeCovers(d){if(!CURRENT_ORDER)return;const t=OPEN_TABLES[CURRENT_ORDER.tableNum];if(!t)return;t.covers=Math.max(1,t.covers+d);document.getElementById('covers-val').textContent=t.covers;}

// ═══════════════════════════════════════════════════
// CALCULS TVA
// ═══════════════════════════════════════════════════
function calcTotal(items){
  let ht=0,tva=0;const tvaMap={};
  (items||[]).forEach(it=>{
    const lHT=it.priceHT*it.qty,lTVA=(it.price-it.priceHT)*it.qty;
    ht+=lHT;tva+=lTVA;
    if(!tvaMap[it.tva])tvaMap[it.tva]={base:0,tva:0};
    tvaMap[it.tva].base+=lHT;tvaMap[it.tva].tva+=lTVA;
  });
  return{ht,tva,ttc:ht+tva,tvaMap};
}
function buildItem(name,price,tvaRate,meta){
  const priceHT=price/(1+tvaRate/100);
  return{id:uid(),name,price,priceHT,tva:tvaRate,meta:meta||null,qty:1};
}

// ═══════════════════════════════════════════════════
// COMMANDE TABLE
// ═══════════════════════════════════════════════════
function renderOrder(){
  const t=OPEN_TABLES[CURRENT_ORDER?.tableNum];if(!t)return;
  document.getElementById('covers-val').textContent=t.covers;
  const list=document.getElementById('items-list');
  if(!t.items.length){
    list.innerHTML='<div class="order-empty">Aucun article — appuyez sur + Menu</div>';
    updateOrderTotals(t);return;
  }
  list.innerHTML=t.items.map((it,i)=>`
    <div class="order-item">
      <div class="oi-main">
        <div class="oi-name">${esc(it.name)}</div>
        ${it.meta?`<div class="oi-meta">${esc(it.meta)}</div>`:''}
        <span class="oi-tva">TVA ${it.tva}%</span>
      </div>
      <div class="oi-qty">
        <button class="oi-qbtn" onclick="changeQty(${i},-1)">−</button>
        <span class="oi-qval">${it.qty}</span>
        <button class="oi-qbtn" onclick="changeQty(${i},1)">+</button>
      </div>
      <div class="oi-price">${fmt(it.price*it.qty)}</div>
      <button class="oi-del" onclick="removeItem(${i})">×</button>
    </div>`).join('');
  updateOrderTotals(t);
}
function updateOrderTotals(t){
  const{ht,tva,ttc}=calcTotal(t.items);
  document.getElementById('ht-val').textContent=fmt(ht);
  document.getElementById('tva-val').textContent=fmt(tva);
  document.getElementById('ttc-val').textContent=fmt(ttc);
  document.getElementById('btn-encaisser').disabled=!t.items.length;
}
function changeQty(i,d){const t=OPEN_TABLES[CURRENT_ORDER.tableNum];t.items[i].qty=Math.max(1,t.items[i].qty+d);renderOrder();}
function removeItem(i){const t=OPEN_TABLES[CURRENT_ORDER.tableNum];t.items.splice(i,1);renderOrder();}
function addItemToOrder(name,price,tvaRate,meta){
  const t=OPEN_TABLES[CURRENT_ORDER.tableNum];
  if(!meta){const ex=t.items.find(x=>x.name===name&&x.tva===tvaRate&&!x.meta);if(ex){ex.qty++;renderOrder();closeSheet();toast('✓ '+name);return;}}
  t.items.push(buildItem(name,price,tvaRate,meta));
  renderOrder();closeSheet();toast('✓ '+name);
}

// ═══════════════════════════════════════════════════
// ADD SHEET
// ═══════════════════════════════════════════════════
async function openSheet(mode){
  SHEET_MODE=mode;
  document.getElementById('add-sheet').style.display='flex';
  document.querySelectorAll('.sheet-tab').forEach((b,i)=>b.classList.toggle('on',['menus','vins','divers'][i]===mode));
  if(mode==='menus'){
    await loadCarteIfNeeded();
    getMenusSync().forEach(m=>{if(!MENU_SEL[m.id])initMenuSel(m.id);});
  }
  renderSheetBody();
}
// Raccourci pour ouvrir le sheet menus sur un menu précis (depuis vue emporter)
function openSheetMenu(mi){
  SELECTED_MENU_ID=getMenusSync()[mi]?.id||null;
  openSheet('menus');
}
function closeSheet(){document.getElementById('add-sheet').style.display='none';}
function swSheetTab(mode,btn){SHEET_MODE=mode;document.querySelectorAll('.sheet-tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderSheetBody();}
function initMenuSel(menuId){MENU_SEL[menuId]={};const m=getMenusSync().find(x=>x.id===menuId);if(m)m.sections.forEach(s=>{MENU_SEL[menuId][s.id]=null;});}
function isEmp(){return CURRENT_ORDER?.isEmporter}

// Tables globales pour éviter JSON.stringify dans les onclick (bug guillemets)
let WINES_ARR = [];

// ── Source des menus : DB-Carte (auto) ou Manuel (secours) ──
// DB-Carte structure : { menus:[{id,name,priceTTC,tva,seqIds:[]}], sequences:[{id,name,fromage,priceExtra,dishes:[]}] }
// Les séquences avec fromage:true → sections type 'option' (oui/non + supplément)
// Les autres séquences → sections type 'fixed' (incluses, pas de choix dans le picker)
function carteMenusToCash(carteData){
  if(!carteData?.menus||!carteData?.sequences)return[];
  return carteData.menus.map(m=>{
    const seqs=(m.seqIds||[]).map(id=>carteData.sequences.find(s=>s.id===id)).filter(Boolean);
    const sections=seqs.map(seq=>({
      id:seq.id, name:seq.name,
      type:seq.fromage?'option':'fixed',
      required:false,
      supPrice:seq.fromage?(seq.priceExtra||0):0,
      source:'carte', manualChoices:[]
    }));
    return{id:m.id, name:m.name, price:m.priceTTC||0, tva:m.tva||10, sections};
  });
}
// Retourne les menus actifs (sync) — depuis CARTE_CACHE ou menus manuels
function getMenusSync(){
  if(CASH_DATA.menuSource==='manual')return CASH_DATA.menus;
  if(CARTE_CACHE)return carteMenusToCash(CARTE_CACHE);
  return CASH_DATA.menus; // fallback si cache pas encore chargé
}
// Charge CARTE_CACHE depuis Supabase si nécessaire (async)
async function loadCarteIfNeeded(){
  if(CASH_DATA.menuSource==='manual')return;
  if(!CARTE_CACHE)CARTE_CACHE=await sbLoad('db-carte');
}

async function renderSheetBody(){
  const body=document.getElementById('sheet-body');
  if(SHEET_MODE==='menus'){
    if(CASH_DATA.menuSource!=='manual'&&!CARTE_CACHE){
      body.innerHTML='<div style="padding:24px;text-align:center;color:var(--txt3)">Chargement des menus…</div>';
      await loadCarteIfNeeded();
    }
    const menus=getMenusSync();
    if(!menus.length){body.innerHTML='<div class="order-empty">Aucun menu — vérifiez DB-Carte ou passez en mode manuel dans Admin</div>';return;}
    const tva=isEmp()?5.5:10;
    renderMenuList(body,tva);
  }
  else if(SHEET_MODE==='vins'){
    body.innerHTML='<div style="padding:24px;text-align:center;color:var(--txt3)">Chargement…</div>';
    if(!WINE_CACHE)WINE_CACHE=await sbLoad('db-wine');
    if(!WINE_CACHE){body.innerHTML='<div class="order-empty">DB-Wine non disponible</div>';return;}
    WINES_ARR=[];
    ['aperitifs','vins','digestifs'].forEach(k=>{
      const tab=WINE_CACHE[k];if(!tab)return;
      tab.sections.forEach(sec=>{
        const lists=sec.subsections?sec.subsections.map(s=>s.items||[]):[sec.items||[]];
        lists.forEach(items=>items.forEach(it=>{if(it&&it.n&&it.stock!==0)WINES_ARR.push(it);}));
      });
    });
    if(!WINES_ARR.length){body.innerHTML='<div class="order-empty">Aucun vin disponible</div>';return;}
    renderWineList('');
  }
  else{
    const ctx=isEmp();
    let html='';
    if(CASH_DATA.carte.length){
      const cats=[...new Set(CASH_DATA.carte.map(i=>i.cat))];
      cats.forEach(cat=>{
        html+=`<div style="padding:10px 16px 4px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)">${esc(cat)}</div>`;
        CASH_DATA.carte.forEach((it,i)=>{
          if(it.cat!==cat)return;
          html+=`<div class="add-item" onclick="tapDivers(${i})">
            <div class="ai-name">${esc(it.name)}</div>
            <div style="text-align:right"><div class="ai-price">${fmt(it.price)}</div><div class="ai-tva">TVA ${it.tva}%</div></div>
          </div>`;
        });
      });
    }
    html+=`<div style="padding:10px 16px 4px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)">Article libre</div>
    <div class="libre-form">
      <input class="a-inp" id="libre-name" placeholder="Désignation" autocomplete="off">
      <div class="libre-row">
        <input class="a-inp" id="libre-price" type="number" placeholder="Prix TTC" step="0.5" min="0">
        <select class="a-sel" id="libre-tva">
          <option value="20">TVA 20%</option>
          <option value="10" ${!ctx?'selected':''}>TVA 10%</option>
          <option value="5.5" ${ctx?'selected':''}>TVA 5,5%</option>
        </select>
      </div>

let SELECTED_MENU_ID = null;

function renderMenuList(body,tva){

      </div>
      <div style="text-align:right">
        <div class="ai-price">${fmt(m.price)}</div>

function selectMenu(mi,tva){
  const m=getMenusSync()[mi];if(!m)return;
  SELECTED_MENU_ID=m.id;
  if(!MENU_SEL[m.id])initMenuSel(m.id);
  const body=document.getElementById('sheet-body');
  renderMenuOptions(body,m,mi,tva);
}

function renderMenuOptions(body,m,mi,tva){
  if(!m.sections)m.sections=[];
  const sel=MENU_SEL[m.id]||{};
  const opts=(m.sections||[]).filter(s=>s.type==='option');
  // Indices dans m.sections pour les options (pour onclick)
  const optIdxs=opts.map(s=>m.sections.indexOf(s));
  let price=m.price;
  opts.forEach(s=>{if(sel[s.id]==='oui'&&s.supPrice>0)price+=s.supPrice;});

  let html=`
    <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)">
      <button onclick="SELECTED_MENU_ID=null;renderSheetBody()" style="background:none;border:none;font-size:18px;color:var(--txt3);cursor:pointer">←</button>
      <div style="flex:1">
        <div style="font-size:17px;color:var(--gold);font-weight:600">${esc(m.name)}</div>
        <div style="font-size:12px;color:var(--txt3)">${fmt(price)} · TVA ${tva}%</div>
      </div>
    </div>`;

  if(opts.length){
    html+=`<div style="padding:12px 16px 4px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)">Options</div>`;
    opts.forEach((s,oi)=>{
      const si=optIdxs[oi];
      const v=sel[s.id];
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-size:15px">${esc(s.name)}</div>
          ${s.supPrice>0?`<div style="font-size:11px;color:var(--gold)">+${fmt(s.supPrice)}</div>`:''}
        </div>
        <div style="display:flex;gap:8px">
          <div onclick="setOpt(${mi},${si},1,${tva})"
            style="padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid ${v==='oui'?'var(--gold)':'var(--border-s)'};background:${v==='oui'?'#FFF9EE':'transparent'};color:${v==='oui'?'var(--gold)':'var(--txt2)'}">
            Oui${s.supPrice>0?' +'+fmt(s.supPrice):''}
          </div>
          <div onclick="setOpt(${mi},${si},0,${tva})"
            style="padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid ${v==='non'?'var(--border-s)':'var(--border)'};background:${v==='non'?'var(--bg3)':'transparent'};color:${v==='non'?'var(--txt2)':'var(--txt3)'}">
            Non
          </div>
        </div>
      </div>`;
    });
  }

  html+=`<div style="padding:12px 16px">
    <div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px">Note / Allergie</div>
    <textarea id="menu-comment" rows="2" placeholder="ex : sans gluten, allergie noix…"
      style="width:100%;background:var(--bg);border:1px solid var(--border-s);border-radius:8px;padding:9px;font-size:14px;font-family:var(--serif);color:var(--txt);resize:none">${MENU_SEL[m.id]?._comment||''}</textarea>
  </div>
  <div style="padding:0 16px 16px">
    <button onclick="addMenuFromSheet(${mi},${tva})"
      style="width:100%;background:var(--gold);border:none;color:#fff;padding:14px;border-radius:10px;font-size:16px;font-family:var(--serif);cursor:pointer">
      Ajouter — ${fmt(price)}
    </button>
  </div>`;
  body.innerHTML=html;
}

function setOpt(mi,si,valNum,tva){
  // valNum: 1='oui', 0='non'
  const m=getMenusSync()[mi];if(!m)return;
  const s=m.sections[si];if(!s)return;
  if(!MENU_SEL[m.id])MENU_SEL[m.id]={};
  MENU_SEL[m.id][s.id]=valNum?'oui':'non';
  const body=document.getElementById('sheet-body');
  renderMenuOptions(body,m,mi,tva);
}

function addMenuFromSheet(mi,tva){
  const m=getMenusSync()[mi];if(!m)return;
  const menuId=m.id;
  if(!m.sections)m.sections=[];
  const sel=MENU_SEL[menuId]||{};
  let price=m.price;
  const lines=[];

  // Options (fromage, etc.)
  m.sections.filter(s=>s.type==='option').forEach(s=>{
    if(sel[s.id]==='oui'){
      if(s.supPrice>0){price+=s.supPrice;lines.push(s.name+' +'+fmt(s.supPrice));}
      else lines.push(s.name);
    } else if(sel[s.id]==='non'){
      lines.push('Sans '+s.name.toLowerCase());
    }
  });

  // Commentaire / allergie
  const commentEl=document.getElementById('menu-comment');
  const comment=commentEl?commentEl.value.trim():'';
  if(comment)lines.push('Note : '+comment);
  // Sauvegarder commentaire dans sel
  if(!MENU_SEL[menuId])MENU_SEL[menuId]={};
  MENU_SEL[menuId]._comment=comment;

  const meta=lines.join(' · ')||null;
  SELECTED_MENU_ID=null;
  if(isEmp()){
    EMP_CART.push(buildItem(m.name,price,tva,meta));
    initMenuSel(menuId);updateEmpTotal();closeSheet();toast('✓ '+m.name);
  } else {
    addItemToOrder(m.name,price,tva,meta);
    initMenuSel(menuId);
  }
}

// ── Vins et divers ──
async function addWineToCtx(wineId,name,price,tva){
  if(isEmp()){const ex=EMP_CART.find(x=>x.name===name&&x.tva===tva&&!x.meta);if(ex)ex.qty++;else EMP_CART.push(buildItem(name,price,tva,null));updateEmpTotal();closeSheet();toast('✓ '+name);}
  else addItemToOrder(name,price,tva,null);
  // Décrément stock DB-Wine
  if(!WINE_CACHE)return;
  ['aperitifs','vins','digestifs'].forEach(k=>{const tab=WINE_CACHE[k];if(!tab)return;tab.sections.forEach(sec=>{const lists=sec.subsections?sec.subsections.map(s=>s.items||[]):[sec.items||[]];lists.forEach(items=>{const it=items.find(x=>x&&x.id===wineId);if(it&&it.stock!==null&&it.stock!==undefined)it.stock=Math.max(0,it.stock-1);});});});
  WINE_CACHE._updatedAt=Date.now();await sbSave('db-wine',WINE_CACHE);
}
function addItemCtx(name,price,tva,meta){
  if(isEmp()){const ex=EMP_CART.find(x=>x.name===name&&x.tva===tva&&!x.meta);if(ex)ex.qty++;else EMP_CART.push(buildItem(name,price,tva,meta));updateEmpTotal();closeSheet();toast('✓ '+name);}
  else addItemToOrder(name,price,tva,meta);
}
function addLibreCtx(){
  const name=document.getElementById('libre-name').value.trim();

  if(!name||isNaN(price)||price<=0){toast('Nom et prix requis');return;}
  addItemCtx(name,price,tva,null);
}

function showLogin(){document.getElementById('pw').value='';document.getElementById('pw-err').textContent='';showView('v-login');}

}
function swAdmTab(i,btn){ADM_TAB=i;document.querySelectorAll('.adm-tab').forEach((b,j)=>b.classList.toggle('on',j===i));renderAdm();}
function renderAdm(){const b=document.getElementById('adm-body');[renderAdmMenus,renderAdmCarte,renderAdmSettings][ADM_TAB](b);}

// ── Admin Menus ──
function renderAdmMenus(body){
  const isManual=CASH_DATA.menuSource==='manual';

  if(!isManual){
    // ── Mode DB-Carte : lecture seule ──
    const menus=getMenusSync();
    const rows=menus.length?menus.map(m=>{
      const opts=(m.sections||[]).filter(s=>s.type==='option');
      const fixed=(m.sections||[]).filter(s=>s.type==='fixed');
      return`<div style="padding:12px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:15px;color:var(--gold);font-weight:600">${esc(m.name)}</span>
          <span style="font-size:14px;color:var(--txt2)">${fmt(m.price)} · TVA ${m.tva}%</span>
        </div>
        ${fixed.length?`<div style="font-size:11px;color:var(--txt3);margin-top:3px">Inclus : ${fixed.map(s=>esc(s.name)).join(' · ')}</div>`:''}
        ${opts.length?`<div style="font-size:11px;color:var(--blue);margin-top:2px">Options : ${opts.map(s=>esc(s.name)+(s.supPrice>0?' +'+fmt(s.supPrice):'')).join(' · ')}</div>`:''}
      </div>`;
    }).join(''):`<div style="color:var(--txt3);font-style:italic;font-size:13px;padding:12px 0">Aucun menu chargé — vérifiez DB-Carte</div>`;

    body.innerHTML=`
      <div class="adm-sec" style="border-color:var(--green)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div class="adm-sec-title" style="margin-bottom:0">Source : DB-Carte</div>
          <span style="background:var(--green);color:#fff;padding:2px 10px;border-radius:10px;font-size:9px;letter-spacing:.1em">ACTIF</span>
        </div>
        <div style="font-size:12px;color:var(--txt3);margin-bottom:12px">Les menus sont synchronisés automatiquement depuis DB-Carte. Modifier un menu dans DB-Carte → visible immédiatement ici.</div>
        ${rows}
        <div class="adm-row" style="margin-top:14px">
          <button class="adm-btn" onclick="CARTE_CACHE=null;loadCarteIfNeeded().then(()=>renderAdm());toast('✓ Rechargé depuis DB-Carte')">🔄 Recharger DB-Carte</button>
        </div>
      </div>
      <div class="adm-sec" style="border-color:rgba(183,28,28,.3)">
        <div class="adm-sec-title" style="color:var(--red)">Mode secours</div>
        <div style="font-size:12px;color:var(--txt2);margin-bottom:10px">En cas de bug DB-Carte, activez le mode secours pour définir des menus manuellement dans DB-Cash.</div>
        <button class="adm-btn danger" onclick="if(confirm('Passer en mode secours ? DB-Carte ne sera plus utilisé comme source des menus.')){CASH_DATA.menuSource='manual';saveCash();renderAdm();}">⚠ Activer le mode secours manuel</button>
      </div>`;
    return;
  }

  // ── Mode Manuel (secours) : éditeur complet ──
  body.innerHTML=`
    <div class="adm-sec" style="background:#FFF9EE;border-color:var(--gold)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="font-size:22px">⚠</span>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--gold)">Mode secours actif — menus manuels</div>
          <div style="font-size:11px;color:var(--txt2)">DB-Carte n'est pas utilisé comme source.</div>
        </div>
        <button class="adm-btn" style="margin-left:auto" onclick="if(confirm('Revenir aux menus DB-Carte ?')){CASH_DATA.menuSource='carte';saveCash();renderAdm();}">↩ Revenir à DB-Carte</button>
      </div>
    </div>`+
  CASH_DATA.menus.map((m,mi)=>`
    <div class="adm-sec">
      <div class="adm-row">
        <input class="adm-inp" value="${esc(m.name)}" style="font-size:14px;color:var(--gold);font-weight:600" onchange="CASH_DATA.menus[${mi}].name=this.value;saveCash()">
        <input class="adm-inp" type="number" value="${m.price}" style="max-width:80px" onchange="CASH_DATA.menus[${mi}].price=parseFloat(this.value)||0;saveCash()">
        <span style="font-size:12px;color:var(--txt3)">€</span>
        <button class="adm-btn danger" onclick="if(confirm('Supprimer ce menu ?')){CASH_DATA.menus.splice(${mi},1);saveCash();renderAdm();}">Supprimer</button>
      </div>
      <div style="font-size:11px;color:var(--txt3);margin-bottom:8px"><span style="color:var(--blue)">●</span> Option oui/non  <span style="color:var(--green)">●</span> Inclus fixe</div>
      ${m.sections.map((s,si)=>`
        <div class="sec-adm-card">
          <div class="sec-adm-head">
            <div class="sec-type-dot ${s.type}"></div>
            <span class="sec-adm-name">${esc(s.name)}</span>
            <button class="adm-btn danger" onclick="CASH_DATA.menus[${mi}].sections.splice(${si},1);saveCash();renderAdm()">×</button>
          </div>
          <div class="adm-row" style="flex-wrap:wrap;gap:6px">
            <input class="adm-inp" value="${esc(s.name)}" placeholder="Nom" style="max-width:130px" onchange="CASH_DATA.menus[${mi}].sections[${si}].name=this.value;saveCash()">
            <select class="adm-sel" onchange="CASH_DATA.menus[${mi}].sections[${si}].type=this.value;saveCash();renderAdm()">
              <option value="option" ${s.type==='option'?'selected':''}>Option oui/non</option>
              <option value="fixed" ${s.type==='fixed'?'selected':''}>Inclus (fixe)</option>
            </select>
            ${s.type==='option'?`<input class="adm-inp" type="number" value="${s.supPrice||0}" placeholder="Suppl. €" style="max-width:80px" onchange="CASH_DATA.menus[${mi}].sections[${si}].supPrice=parseFloat(this.value)||0;saveCash()"><span style="font-size:11px;color:var(--txt3)">€ suppl.</span>`:''}
          </div>
        </div>`).join('')}
      <div class="adm-row" style="margin-top:6px">
        <input class="adm-inp" id="sec-name-${mi}" placeholder="Nom section (ex: Fromage)">
        <select class="adm-sel" id="sec-type-${mi}">
          <option value="option">Option oui/non</option>
          <option value="fixed">Inclus (fixe)</option>
        </select>
        <button class="adm-btn primary" onclick="addSection(${mi})">+ Section</button>
      </div>
    </div>`).join('')+`
    <div class="adm-sec">
      <div class="adm-sec-title">Créer un menu de secours</div>
      <div class="adm-row">
        <input class="adm-inp" id="new-m-name" placeholder="Nom du menu">
        <input class="adm-inp" type="number" id="new-m-price" placeholder="Prix €" style="max-width:90px" step="0.5" min="0">
        <button class="adm-btn primary" onclick="addMenu()">+ Menu</button>
      </div>
    </div>`;
}

function addSection(mi){
  const name=document.getElementById(`sec-name-${mi}`).value.trim();
  const type=document.getElementById(`sec-type-${mi}`).value;
  if(!name)return;
  CASH_DATA.menus[mi].sections.push({id:uid(),name,type,required:type==='choice',supPrice:0,source:'carte',manualChoices:[]});
  saveCash();renderAdm();
}
function addMenu(){
  const name=document.getElementById('new-m-name').value.trim();
  const price=parseFloat(document.getElementById('new-m-price').value)||0;
  if(!name)return;
  CASH_DATA.menus.push({id:uid(),name,price,sections:[]});
  saveCash();renderAdm();toast('✓ Menu créé — ajoutez les sections');
}

        <div class="adm-item">
          <span class="adm-item-name">${esc(it.name)}</span>
          <span style="font-size:12px;color:var(--gold)">${fmt(it.price)}</span>

        <select class="adm-sel" id="c-tva"><option value="20">20%</option><option value="10" selected>10%</option><option value="5.5">5,5%</option></select>
      </div>
      <div class="adm-row">

function addCarteItem(){
  const name=document.getElementById('c-name').value.trim(),price=parseFloat(document.getElementById('c-price').value),tva=parseFloat(document.getElementById('c-tva').value),catN=document.getElementById('c-cat-new').value.trim(),cat=catN||document.getElementById('c-cat').value||'Divers';

  CASH_DATA.carte.push({id:uid(),name,price,tva,cat});saveCash();renderAdm();toast('✓ Article ajouté');
}

    <div class="adm-sec" style="border-color:var(--red)">

      </div>
      <div class="z-row" style="margin-bottom:8px"><span class="z-lbl">Tickets à supprimer</span><span class="z-val" style="color:var(--red)">${SESSION_TICKETS.length}</span></div>
      <div class="z-row" style="margin-bottom:12px"><span class="z-lbl">Compteur ticket actuel</span><span class="z-val" style="color:var(--red)">N°${TICKET_SEQ}</span></div>

function changePw(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(!p1||p1!==p2){toast('Mots de passe différents');return;}PASS=p1;localStorage.setItem('db_cash_pass',p1);sbSaveSetting('db_cash_pass',p1);toast('✓ Mot de passe modifié');}
function resetPourVraiService(){
  if(!confirm('Effacer tous les tickets de test et remettre le compteur à zéro ?\n\nCette action est irréversible — à faire uniquement avant le premier vrai service.'))return;
  SESSION_TICKETS=[];
  TICKET_SEQ=0;
  LAST_HASH='0'.repeat(64);
  localStorage.setItem('db_cash_seq','0');
  localStorage.setItem('db_cash_last_hash','0'.repeat(64));
  saveSessionTickets();
  renderAdm();
  toast('✓ Compteurs remis à zéro — prêt pour le premier vrai service');
}

// ═══════════════════════════════════════════════════
// PERSISTANCE
// ═══════════════════════════════════════════════════
function saveCash(){localStorage.setItem('db_cash_data',JSON.stringify(CASH_DATA));sbSave('db-cash-config',CASH_DATA);}
// Migration : ancien format items{entrees,plats,desserts} → nouveau format sections[]
function migrateMenus(menus){
  return (menus||[]).map(m=>{
    if(m.sections)return m; // déjà bon
    const it=m.items||{};
    const secs=[];
    if((it.entrees||[]).length||true)  secs.push({id:'s-'+m.id+'-e',name:'Entrée',   type:'choice',required:true, supPrice:0,source:'manual',manualChoices:(it.entrees||[]).map(x=>({id:x.id||x.name,name:x.name}))});
    if((it.plats||[]).length||true)    secs.push({id:'s-'+m.id+'-p',name:'Plat',     type:'choice',required:true, supPrice:0,source:'manual',manualChoices:(it.plats||[]).map(x=>({id:x.id||x.name,name:x.name}))});
    if((it.desserts||[]).length||true) secs.push({id:'s-'+m.id+'-d',name:'Dessert',  type:'choice',required:true, supPrice:0,source:'manual',manualChoices:(it.desserts||[]).map(x=>({id:x.id||x.name,name:x.name}))});
    if((it.supplements||[]).length)    secs.push({id:'s-'+m.id+'-s',name:'Supplément',type:'option',required:false,supPrice:0,source:'manual',manualChoices:(it.supplements||[]).map(x=>({id:x.id||x.name,name:x.name,sup:x.sup}))});
    return{...m,sections:secs};
  });
}
function loadCash(){
  const r=localStorage.getItem('db_cash_data');
  if(r)try{
    const d=JSON.parse(r);
    if(d.menus&&d.carte){
      d.menus=migrateMenus(d.menus);
      CASH_DATA=d;
    }
  }catch(_){}
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
(async()=>{
  updateDate();setInterval(updateDate,60000);
  // Vider le cache local si format ancien (pas de sections)
  try{
    const raw=localStorage.getItem('db_cash_data');
    if(raw){const d=JSON.parse(raw);if(d.menus&&d.menus[0]&&!d.menus[0].sections)localStorage.removeItem('db_cash_data');}
  }catch(_){}
  loadCash();loadOpenTables();loadSessionTickets();
  renderTables();
  const sbPass=await sbLoadSetting('db_cash_pass');
  if(sbPass){PASS=sbPass;localStorage.setItem('db_cash_pass',sbPass);}
  const sbConf=await sbLoad('db-cash-config');
  if(sbConf&&(sbConf.carte!==undefined||sbConf.menuSource)){
    sbConf.menus=migrateMenus(sbConf.menus||[]);
    if(!sbConf.menuSource)sbConf.menuSource='carte'; // migration : par défaut DB-Carte
    CASH_DATA=sbConf;
    localStorage.setItem('db_cash_data',JSON.stringify(CASH_DATA));
    renderTables();
  }
  // Précharger DB-Carte en arrière-plan pour avoir les menus dès le premier tap
  if(CASH_DATA.menuSource!=='manual'){
    loadCarteIfNeeded().then(()=>{
      getMenusSync().forEach(m=>{if(!MENU_SEL[m.id])initMenuSel(m.id);});
    });
  } else {
    getMenusSync().forEach(m=>initMenuSel(m.id));
  }
})();
</script>
