<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DB Cash — L'Atelier Privé</title>
  <link rel="apple-touch-icon" href="db-cash-icon.png">
  <link rel="icon" type="image/png" href="db-cash-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #B4963C; --gold-d: #9A7E2E; --gold-light: #C8AA50;
      --bg: #111111; --bg2: #1A1A1A; --bg3: #222222;
      --txt: #F5F0E8; --txt2: #AAA49C; --txt3: #666660;
      --border: rgba(180,150,60,0.18);
      --red: #E53935; --green: #4CAF50; --blue: #2196F3;
      --serif: 'Cormorant Garamond', Georgia, serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--txt);font-family:var(--serif);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}

    /* ── VIEWS ── */
    .view{display:none;flex-direction:column;flex:1;min-height:0}
    .view.active{display:flex}

    /* ── HEADER ── */
    .hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
    .hdr-title{font-size:22px;font-weight:300;letter-spacing:.08em;flex:1}
    .hdr-title span{color:var(--gold);font-weight:600}
    .hdr-sub{font-size:11px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}
    .btn-back{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--txt2);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
    .btn-back:hover{border-color:var(--gold);color:var(--gold)}

    /* ── TABLES GRID ── */
    .tables-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 16px;flex:1;align-content:start}
    .table-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .15s;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
    .table-card:active{transform:scale(.97)}
    .table-card.occupied{border-color:var(--gold);background:var(--bg3)}
    .table-card.occupied .table-num{color:var(--gold)}
    .table-num{font-size:32px;font-weight:300;color:var(--txt2)}
    .table-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)}
    .table-total{font-size:14px;color:var(--gold);font-style:italic}
    .table-covers{font-size:10px;color:var(--txt3)}

    /* ── EMPORTER BTN ── */
    .emporter-btn{margin:0 16px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;flex-shrink:0}
    .emporter-btn:active{background:var(--bg3)}
    .emporter-btn-title{font-size:18px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
    .emporter-btn-sub{font-size:12px;color:var(--txt3);font-style:italic;margin-top:4px}

    /* ── BOTTOM BAR ── */
    .bottom-bar{display:flex;gap:8px;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
    .btn-z{flex:1;background:none;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);cursor:pointer}
    .btn-z:hover{border-color:var(--gold);color:var(--gold)}
    .btn-admin{background:none;border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:11px;color:var(--txt3);cursor:pointer}

    /* ── ORDER VIEW ── */
    .order-body{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
    .covers-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
    .covers-label{font-size:12px;color:var(--txt2);letter-spacing:.05em}
    .covers-ctrl{display:flex;align-items:center;gap:8px}
    .covers-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .covers-val{font-size:16px;min-width:24px;text-align:center}
    .covers-btn:hover{border-color:var(--gold)}
    .order-type-badge{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--txt3)}
    .order-type-badge.emporter{border-color:var(--blue);color:var(--blue)}

    .items-list{flex:1;overflow-y:auto;padding:0 0 8px}
    .order-item{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:.5px solid var(--border)}
    .oi-name{flex:1;font-size:15px}
    .oi-tva-badge{font-size:9px;color:var(--txt3);border:1px solid var(--border);border-radius:10px;padding:2px 6px;flex-shrink:0}
    .oi-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .oi-qty-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--txt);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .oi-qty-btn:hover{border-color:var(--gold)}
    .oi-qty-val{font-size:14px;min-width:20px;text-align:center}
    .oi-price{font-size:15px;color:var(--gold);min-width:60px;text-align:right;flex-shrink:0}
    .oi-del{background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0}
    .oi-del:hover{color:var(--red)}
    .order-empty{padding:40px;text-align:center;color:var(--txt3);font-style:italic;font-size:15px}

    .order-footer{background:var(--bg2);border-top:1px solid var(--border);padding:12px 16px;flex-shrink:0}
    .totals-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
    .totals-label{font-size:12px;color:var(--txt3);letter-spacing:.05em}
    .totals-val{font-size:13px;color:var(--txt2)}
    .totals-total{font-size:20px;color:var(--gold);font-weight:600}
    .btn-encaisser{width:100%;margin-top:10px;background:var(--gold);border:none;color:#fff;padding:14px;border-radius:10px;font-size:16px;font-family:var(--serif);letter-spacing:.05em;cursor:pointer}
    .btn-encaisser:hover{background:var(--gold-d)}
    .btn-encaisser:disabled{opacity:.4;cursor:default}

    /* ── ADD ITEMS SHEET ── */
    .add-sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;flex-direction:column;justify-content:flex-end}
    .add-sheet-inner{background:var(--bg2);border-radius:20px 20px 0 0;max-height:75vh;display:flex;flex-direction:column}
    .add-sheet-hdr{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
    .add-sheet-title{flex:1;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
    .add-sheet-close{background:none;border:none;font-size:22px;color:var(--txt3);cursor:pointer}
    .add-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
    .add-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);cursor:pointer}
    .add-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
    .add-list{flex:1;overflow-y:auto;padding:8px 0}
    .add-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border);cursor:pointer}
    .add-item:active{background:var(--bg3)}
    .add-item-name{flex:1;font-size:15px}
    .add-item-meta{font-size:11px;color:var(--txt3);font-style:italic}
    .add-item-price{font-size:15px;color:var(--gold);flex-shrink:0}
    .add-item-tva{font-size:9px;color:var(--txt3);flex-shrink:0}
    .add-libre-form{padding:16px;display:flex;flex-direction:column;gap:10px}
    .add-libre-row{display:grid;grid-template-columns:1fr auto auto;gap:8px}
    .add-inp{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:14px;color:var(--txt);font-family:var(--serif)}
    .add-inp:focus{outline:none;border-color:var(--gold)}
    .add-inp-sm{width:70px}
    .tva-sel{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 6px;font-size:13px;color:var(--txt2);cursor:pointer}
    .tva-sel:focus{outline:none;border-color:var(--gold)}
    .btn-add-libre{background:var(--gold);border:none;color:#fff;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:var(--serif)}

    /* ── PAIEMENT ── */
    .pay-body{flex:1;overflow-y:auto;padding:16px}
    .pay-summary{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
    .pay-summary-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px}
    .pay-item{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--txt2)}
    .pay-total-row{display:flex;justify-content:space-between;font-size:18px;color:var(--gold);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .pay-method{background:var(--bg2);border:2px solid var(--border);border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .15s}
    .pay-method.on{border-color:var(--gold);background:var(--bg3)}
    .pay-method-icon{font-size:24px;margin-bottom:4px}
    .pay-method-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
    .pay-especes{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
    .pay-esp-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px}
    .pay-esp-inp{width:100%;font-size:24px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--gold);padding:6px 0;font-family:var(--serif);text-align:right}
    .pay-esp-inp:focus{outline:none;border-bottom-color:var(--gold)}
    .pay-rendu{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
    .pay-rendu-label{font-size:12px;color:var(--txt3)}
    .pay-rendu-val{font-size:20px;color:var(--green)}
    .tva-recap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
    .tva-recap-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px}
    .tva-line{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:3px}
    .btn-valider{width:100%;background:var(--gold);border:none;color:#fff;padding:16px;border-radius:10px;font-size:17px;font-family:var(--serif);letter-spacing:.05em;cursor:pointer;margin-top:8px}
    .btn-valider:hover{background:var(--gold-d)}
    .btn-valider:disabled{opacity:.4;cursor:default}

    /* ── TICKET ── */
    .ticket-view{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;overflow-y:auto}
    .ticket-paper{background:#fff;color:#1a1a1a;width:100%;max-width:360px;padding:20px;border-radius:8px;font-family:Georgia,serif}
    .ticket-logo{text-align:center;margin-bottom:12px;border-bottom:1px solid #ccc;padding-bottom:12px}
    .ticket-logo-name{font-size:22px;font-weight:300;letter-spacing:.1em}
    .ticket-logo-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#888;margin-top:2px}
    .ticket-info{font-size:10px;color:#666;margin-bottom:10px;text-align:center}
    .ticket-items{border-top:1px dashed #ccc;border-bottom:1px dashed #ccc;padding:8px 0;margin-bottom:8px}
    .ticket-item{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
    .ticket-item-name{flex:1}
    .ticket-item-qty{min-width:24px;text-align:center;color:#888}
    .ticket-item-price{min-width:50px;text-align:right}
    .ticket-totals{font-size:11px;margin-bottom:8px}
    .ticket-total-row{display:flex;justify-content:space-between;margin-bottom:2px}
    .ticket-total-row.big{font-size:14px;font-weight:bold;border-top:1px solid #ccc;padding-top:5px;margin-top:5px}
    .ticket-tva{font-size:9px;color:#888;margin-bottom:8px}
    .ticket-tva-row{display:flex;justify-content:space-between;margin-bottom:1px}
    .ticket-payment{font-size:11px;margin-bottom:8px;border-top:1px dashed #ccc;padding-top:8px}
    .ticket-footer{font-size:9px;color:#999;text-align:center;border-top:1px solid #ccc;padding-top:8px;line-height:1.6}
    .ticket-hash{font-size:7px;color:#ccc;text-align:center;margin-top:6px;word-break:break-all}
    .ticket-btns{display:flex;gap:10px;margin-top:16px;width:100%;max-width:360px}
    .btn-print{flex:1;background:var(--gold);border:none;color:#fff;padding:13px;border-radius:8px;font-size:14px;font-family:var(--serif);cursor:pointer}
    .btn-print:hover{background:var(--gold-d)}
    .btn-new{flex:1;background:none;border:1px solid var(--border);color:var(--txt2);padding:13px;border-radius:8px;font-size:14px;font-family:var(--serif);cursor:pointer}

    /* ── EMPORTER VIEW ── */
    .emp-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
    .emp-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:12px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);cursor:pointer}
    .emp-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
    .emp-body{flex:1;overflow-y:auto}
    .emp-menu-card{margin:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px}
    .emp-menu-name{font-size:18px;color:var(--gold);letter-spacing:.08em;margin-bottom:4px}
    .emp-menu-price{font-size:13px;color:var(--txt2);font-style:italic;margin-bottom:12px}
    .emp-menu-section{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
    .emp-choice{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid var(--border);cursor:pointer}
    .emp-choice:last-child{border-bottom:none}
    .emp-choice-radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .emp-choice-radio.on{border-color:var(--gold);background:var(--gold)}
    .emp-choice-radio.on::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
    .emp-choice-name{flex:1;font-size:14px}
    .emp-choice-sup{font-size:12px;color:var(--gold);font-style:italic}
    .emp-menu-btn{width:100%;margin-top:12px;background:var(--gold);border:none;color:#fff;padding:12px;border-radius:8px;font-size:14px;font-family:var(--serif);cursor:pointer}
    .emp-menu-btn:disabled{opacity:.4;cursor:default}
    .emp-section-hdr{padding:14px 16px 6px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
    .emp-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border);cursor:pointer}
    .emp-item:active{background:var(--bg3)}
    .emp-item-name{flex:1;font-size:15px}
    .emp-item-price{font-size:15px;color:var(--gold);flex-shrink:0}

    /* ── Z CAISSE ── */
    .z-body{flex:1;overflow-y:auto;padding:16px}
    .z-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .z-card-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px}
    .z-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
    .z-row-label{color:var(--txt2)}
    .z-row-val{color:var(--txt)}
    .z-total{display:flex;justify-content:space-between;font-size:18px;color:var(--gold);padding-top:10px;border-top:1px solid var(--border);margin-top:6px}
    .z-empty{text-align:center;padding:60px;color:var(--txt3);font-style:italic}
    .btn-print-z{width:100%;background:var(--gold);border:none;color:#fff;padding:13px;border-radius:8px;font-size:14px;font-family:var(--serif);cursor:pointer;margin-top:8px}

    /* ── ADMIN / LOGIN ── */
    .login-box{max-width:320px;margin:3rem auto;padding:2rem;background:var(--bg2);border:1px solid var(--border);border-radius:16px}
    .login-title{font-size:18px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem}
    .login-inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:16px;color:var(--txt);font-family:var(--serif);margin-bottom:.6rem}
    .login-inp:focus{outline:none;border-color:var(--gold)}
    .login-btn{width:100%;background:var(--gold);border:none;color:#fff;padding:12px;border-radius:8px;font-size:15px;font-family:var(--serif);cursor:pointer}
    .login-err{font-size:12px;color:var(--red);margin-top:.4rem;text-align:center}

    /* ── ADMIN PANEL ── */
    .adm-body{flex:1;overflow-y:auto;padding:16px}
    .adm-section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .adm-section-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
    .adm-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .adm-inp{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--txt);font-family:var(--serif)}
    .adm-inp:focus{outline:none;border-color:var(--gold)}
    .adm-inp-sm{width:70px}
    .adm-sel{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 6px;font-size:12px;color:var(--txt2);cursor:pointer}
    .adm-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--txt2);cursor:pointer;white-space:nowrap}
    .adm-btn:hover{border-color:var(--gold);color:var(--gold)}
    .adm-btn.danger:hover{border-color:var(--red);color:var(--red)}
    .adm-btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
    .adm-item-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:.5px solid var(--border)}
    .adm-item-name{flex:1;font-size:13px}
    .adm-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
    .adm-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);cursor:pointer}
    .adm-tab.on{color:var(--gold);border-bottom-color:var(--gold)}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── PRINT ── */
    @media print {
      body{background:#fff!important;color:#000!important}
      .view{display:none!important}
      #print-ticket{display:block!important}
      #print-ticket *{color:#000!important;background:#fff!important}
    }
    #print-ticket{display:none}
  </style>
</head>
<body>

<!-- ══ VIEW : ACCUEIL ══ -->
<div class="view active" id="v-accueil">
  <div class="hdr" id="hdr-accueil">
    <div>
      <div class="hdr-title">DB <span>Cash</span></div>
      <div class="hdr-sub" id="hdr-date"></div>
    </div>
  </div>
  <div class="tables-grid" id="tables-grid"></div>
  <div class="emporter-btn" onclick="showEmporter()">
    <div class="emporter-btn-title">📦 Vente à emporter</div>
    <div class="emporter-btn-sub">Menus semaine · Carte ponctuelle</div>
  </div>
  <div class="bottom-bar">
    <button class="btn-z" onclick="showZ()">📊 Z de caisse</button>
    <button class="btn-admin" id="btn-admin" onclick="showLogin()">⚙</button>
  </div>
</div>

<!-- ══ VIEW : COMMANDE TABLE ══ -->
<div class="view" id="v-order">
  <div class="hdr">
    <button class="btn-back" onclick="backToAccueil()">← Tables</button>
    <div class="hdr-title" id="order-title">Table <span>1</span></div>
  </div>
  <div class="covers-bar">
    <span class="covers-label">Couverts</span>
    <div class="covers-ctrl">
      <button class="covers-btn" onclick="changeCovers(-1)">−</button>

// ============================================================
// ISCA — HASH CHAÎNÉ
// ============================================================
async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function chainedHash(ticketData){
  const hash=await sha256(JSON.stringify(ticketData)+LAST_HASH);
  LAST_HASH=hash;
  localStorage.setItem('db_cash_last_hash',hash);
  return hash;
}

// ============================================================

// ============================================================
function calcTotal(items){
  let ht=0,tva=0;
  const tvaMap={};
  items.forEach(it=>{
    const lineHT=it.priceHT*it.qty;
    const lineTVA=(it.price-it.priceHT)*it.qty;
    ht+=lineHT; tva+=lineTVA;
    if(!tvaMap[it.tva])tvaMap[it.tva]={base:0,tva:0};
    tvaMap[it.tva].base+=lineHT;
    tvaMap[it.tva].tva+=lineTVA;
  });
  return{ht,tva,ttc:ht+tva,tvaMap};
}

function buildItem(name,price,tvaRate,meta){
  const priceHT=price/(1+tvaRate/100);
  return{id:uid(),name,price,priceHT,tva:tvaRate,meta:meta||null,qty:1};
}

  // Sur place: food=10%, alcool=20%. À emporter: food=5.5%, alcool=20%

  const alc=!item.nonAlcool&&item.degre; // a un degré d'alcool et n'est pas marqué non-alcoolisé

  WINE_CACHE._updatedAt=Date.now();
  await sbSave('db-wine',WINE_CACHE);

        <input class="pay-esp-inp" id="esp-amount" type="number" placeholder="${ttc.toFixed(2)}" step="0.01" oninput="updateRendu(${ttc})">
        <div class="pay-rendu">
          <span class="pay-rendu-label">Rendu monnaie</span>
          <span class="pay-rendu-val" id="rendu-val">—</span>
        </div>
      </div>
    </div>
    <button class="btn-valider" onclick="validerPaiement(${ttc})">✓ Valider & imprimer</button>`;
  showView('v-pay');
}

function showPayEmporter(){
  CURRENT_ORDER={tableNum:null,isEmporter:true};
  showPay();
}

function selectPayMethod(m){
  PAY_METHOD=m;
  ['cb','especes','cheque'].forEach(x=>{
    document.getElementById('pm-'+x)?.classList.toggle('on',x===m);
  });
  document.getElementById('especes-section').style.display=m==='especes'?'block':'none';
}

function updateRendu(ttc){
  const remis=parseFloat(document.getElementById('esp-amount').value)||0;
  const rendu=remis-ttc;
  document.getElementById('rendu-val').textContent=rendu>=0?fmt(rendu):'Insuffisant';
  document.getElementById('rendu-val').style.color=rendu>=0?'var(--green)':'var(--red)';
}

function backToOrder(){
  if(CURRENT_ORDER?.isEmporter)showView('v-emporter');
  else showView('v-order');
}

async function validerPaiement(ttc){
  const t=CURRENT_ORDER.isEmporter?{items:[...EMP_CART],covers:1,type:'emporter'}:OPEN_TABLES[CURRENT_ORDER.tableNum];
  const{ht,tva,tvaMap}=calcTotal(t.items);
  TICKET_SEQ++;
  localStorage.setItem('db_cash_seq',TICKET_SEQ);
  const ticketData={
    seq:TICKET_SEQ,
    date:new Date().toISOString(),
    type:CURRENT_ORDER.isEmporter?'emporter':'table',
    tableNum:CURRENT_ORDER.tableNum,
    covers:t.covers||1,
    items:t.items,
    ht,tva,ttc,tvaMap,
    payment:{method:PAY_METHOD,amount:PAY_METHOD==='especes'?parseFloat(document.getElementById('esp-amount')?.value||ttc):ttc}
  };
  const hash=await chainedHash(ticketData);
  ticketData.hash=hash;
  ticketData.prevHash=LAST_HASH;
  SESSION_TICKETS.push(ticketData);
  saveSessionTickets();
  await sbSave('db-cash',{tickets:SESSION_TICKETS,date:new Date().toDateString()});
  // Fermer la table
  if(!CURRENT_ORDER.isEmporter)delete OPEN_TABLES[CURRENT_ORDER.tableNum];
  else EMP_CART=[];
  saveOpenTables();
  renderTicket(ticketData);
  showView('v-ticket');
}

function saveSessionTickets(){
  localStorage.setItem('db_cash_session',JSON.stringify({tickets:SESSION_TICKETS,date:new Date().toDateString()}));
}
function loadSessionTickets(){
  const raw=localStorage.getItem('db_cash_session');
  if(!raw)return;
  try{const s=JSON.parse(raw);if(s.date===new Date().toDateString())SESSION_TICKETS=s.tickets||[];}catch(_){}
}

function showEmporter(){
  CURRENT_ORDER={tableNum:null,isEmporter:true};
  EMP_CART=[];

function swEmpTab(i,btn){
  EMP_TAB=i;
  document.querySelectorAll('.emp-tab').forEach((b,j)=>b.classList.toggle('on',j===i));
  renderEmpBody();
}

function renderEmpBody(){
  const body=document.getElementById('emp-body');
  if(EMP_TAB===0){
    if(!CASH_DATA.menus.length){body.innerHTML='<div class="order-empty">Aucun menu configuré — voir Admin</div>';return;}
    body.innerHTML=CASH_DATA.menus.map(m=>`
      <div class="emp-menu-card">
        <div class="emp-menu-name">${m.name}</div>
        <div class="emp-menu-price">${fmt(m.price)} · TVA 5,5%</div>
        ${empMenuSection(m,'entrees','Entrées')}
        ${empMenuSection(m,'plats','Plats')}
        ${empMenuSection(m,'desserts','Desserts')}
        ${m.items.supplements.length?empMenuSection(m,'supplements','Suppléments'):''}
        <button class="emp-menu-btn" id="btn-emp-${m.id}" onclick="addMenuToCart(${JSON.stringify(m.id)})"
          ${canAddMenu(m.id)?'':'disabled'}>Ajouter ce menu</button>
      </div>`).join('');
  } else {
    if(!CASH_DATA.carte.length){body.innerHTML='<div class="order-empty">Aucun article — voir Admin</div>';return;}
    const cats=[...new Set(CASH_DATA.carte.map(i=>i.cat))];
    body.innerHTML=cats.map(cat=>`
      <div class="emp-section-hdr">${cat}</div>
      ${CASH_DATA.carte.filter(i=>i.cat===cat).map(it=>`
        <div class="emp-item" onclick="addCarteItemToCart(${JSON.stringify(it.id)})">
          <div class="emp-item-name">${it.name}</div>
          <div style="text-align:right"><div class="emp-item-price">${fmt(it.price)}</div><div style="font-size:9px;color:var(--txt3)">TVA ${it.tva}%</div></div>
        </div>`).join('')}
    `).join('');
  }
}

function empMenuSection(m,key,label){
  const items=m.items[key]||[];
  if(!items.length)return'';
  const sel=EMP_SEL[m.id];
  return`<div class="emp-menu-section">${label}</div>
    ${items.map(it=>`<div class="emp-choice" onclick="selectEmpItem(${JSON.stringify(m.id)},${JSON.stringify(key)},${JSON.stringify(it.id)})">
      <div class="emp-choice-radio${sel[key.slice(0,-1)]===it.id?' on':''}"></div>
      <span class="emp-choice-name">${it.name}</span>
      ${it.sup?`<span class="emp-choice-sup">+${fmt(it.sup)}</span>`:''}
    </div>`).join('')}`;
}

function selectEmpItem(menuId,key,itemId){
  const k=key.slice(0,-1); // entrees→entree etc
  EMP_SEL[menuId][k]=itemId;
  renderEmpBody();
}

function canAddMenu(menuId){
  const m=CASH_DATA.menus.find(x=>x.id===menuId);
  if(!m)return false;
  const sel=EMP_SEL[menuId];
  if(m.items.entrees.length&&!sel.entree)return false;
  if(m.items.plats.length&&!sel.plat)return false;
  if(m.items.desserts.length&&!sel.dessert)return false;
  return true;
}

function addMenuToCart(menuId){
  const m=CASH_DATA.menus.find(x=>x.id===menuId);
  if(!m)return;
  const sel=EMP_SEL[menuId];
  let totalPrice=m.price;
  const details=[];
  ['entrees','plats','desserts','supplements'].forEach(key=>{
    const k=key.slice(0,-1);
    if(sel[k]){
      const it=m.items[key].find(x=>x.id===sel[k]);
      if(it){details.push(it.name);if(it.sup)totalPrice+=it.sup;}
    }
  });
  EMP_CART.push(buildItem(m.name+' ('+details.join(', ')+')',totalPrice,5.5,null));
  EMP_SEL[menuId]={entree:null,plat:null,dessert:null,supplement:null};
  renderEmpBody();
  updateEmpTotal();
  toast('✓ '+m.name+' ajouté');
}

function addCarteItemToCart(itemId){
  const it=CASH_DATA.carte.find(x=>x.id===itemId);
  if(!it)return;
  const existing=EMP_CART.find(x=>x.name===it.name&&x.tva===it.tva);
  if(existing)existing.qty++;
  else EMP_CART.push(buildItem(it.name,it.price,it.tva,null));
  updateEmpTotal();
  toast('✓ '+it.name+' ajouté');
}

function updateEmpTotal(){
  const{ttc}=calcTotal(EMP_CART);
  document.getElementById('emp-ttc').textContent=fmt(ttc);
  document.getElementById('btn-emp-encaisser').disabled=!EMP_CART.length;
}

function renderZ(){
  const body=document.getElementById('z-body');
  if(!SESSION_TICKETS.length){body.innerHTML='<div class="z-empty">Aucune vente enregistrée aujourd\'hui</div>';return;}
  let totalTTC=0,totalHT=0,totalTVA=0;
  const byMethod={cb:0,especes:0,cheque:0};
  const byTva={};
  let covers=0,tickets=SESSION_TICKETS.length;
  SESSION_TICKETS.forEach(t=>{
    totalTTC+=t.ttc;totalHT+=t.ht;totalTVA+=t.tva;
    covers+=(t.covers||1);
    byMethod[t.payment.method]=(byMethod[t.payment.method]||0)+t.ttc;
    Object.entries(t.tvaMap).forEach(([r,v])=>{
      if(!byTva[r])byTva[r]={base:0,tva:0};
      byTva[r].base+=v.base;byTva[r].tva+=v.tva;
    });
  });
  const d=new Date();
  body.innerHTML=`
    <div class="z-card">
      <div class="z-card-title">Z de caisse — ${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      <div class="z-row"><span class="z-row-label">Nombre de tickets</span><span class="z-row-val">${tickets}</span></div>
      <div class="z-row"><span class="z-row-label">Couverts</span><span class="z-row-val">${covers}</span></div>
      <div class="z-total"><span>Total TTC</span><span>${fmt(totalTTC)}</span></div>
    </div>
    <div class="z-card">
      <div class="z-card-title">Modes de règlement</div>
      <div class="z-row"><span class="z-row-label">💳 Carte bancaire</span><span class="z-row-val">${fmt(byMethod.cb||0)}</span></div>
      <div class="z-row"><span class="z-row-label">💶 Espèces</span><span class="z-row-val">${fmt(byMethod.especes||0)}</span></div>
      <div class="z-row"><span class="z-row-label">📝 Chèque</span><span class="z-row-val">${fmt(byMethod.cheque||0)}</span></div>
    </div>
    <div class="z-card">
      <div class="z-card-title">Ventilation TVA</div>
      ${Object.entries(byTva).map(([r,v])=>`
        <div class="z-row"><span class="z-row-label">TVA ${r}%</span><span></span></div>
        <div class="z-row" style="padding-left:12px"><span class="z-row-label">Base HT</span><span class="z-row-val">${fmt(v.base)}</span></div>
        <div class="z-row" style="padding-left:12px"><span class="z-row-label">Montant TVA</span><span class="z-row-val">${fmt(v.tva)}</span></div>
      `).join('')}
      <div class="z-total"><span>Total HT</span><span>${fmt(totalHT)}</span></div>
    </div>
    <div class="z-card" style="font-size:10px;color:var(--txt3)">
      <div class="z-card-title">Intégrité ISCA</div>
      <div>Dernier hash : ${LAST_HASH.slice(0,40)}…</div>
      <div style="margin-top:4px">Ticket N° ${SESSION_TICKETS[0]?.seq||'—'} → N° ${SESSION_TICKETS[SESSION_TICKETS.length-1]?.seq||'—'}</div>
    </div>
    <button class="btn-print-z" onclick="printZ()">🖨 Imprimer le Z</button>`;
}

function printZ(){window.print();}

}

function addMenuItemAdm(mi,key){

function addCarteItem(){

function renderAdmSettings(body){
  body.innerHTML=`
    <div class="adm-section">
      <div class="adm-section-title">Mot de passe</div>

        <input class="adm-inp" id="new-pass1" type="password" placeholder="Nouveau mot de passe">

function changePass(){

  sbSaveSetting('db_cash_pass',p1);
  toast('✓ Mot de passe modifié');
}

function saveCash(){
  localStorage.setItem('db_cash_data',JSON.stringify(CASH_DATA));

}

function loadCash(){
  const raw=localStorage.getItem('db_cash_data');
  if(raw)try{const d=JSON.parse(raw);if(d.menus&&d.carte)CASH_DATA=d;}catch(_){}
}

// INIT
// ============================================================
(async()=>{
  updateDate();
  setInterval(updateDate,60000);
  loadCash();
  loadOpenTables();
  loadSessionTickets();
  renderTables();
  const sbPass=await sbLoadSetting('db_cash_pass');

  const sbConf=await sbLoad('db-cash-config');
  if(sbConf?.menus){CASH_DATA=sbConf;localStorage.setItem('db_cash_data',JSON.stringify(CASH_DATA));}
})();
